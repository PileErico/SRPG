<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChatHub · 多 AI 共桌</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#e3e6ea; --text:#1b1f24; --muted:#6b7480;
    --accent:#3b6ef5; --erico:#0a7d4d; --claude:#c6603f; --gpt:#3a7d8c; --copilot:#7a5bb0;
    --draft:#b8860b; --ok:#0a7d4d;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#15181c; --panel:#1e2227; --border:#2c313a; --text:#e6e9ee; --muted:#8b95a3;
      --accent:#5b86f7; --erico:#4fd08a; --claude:#e0846a; --gpt:#5fb4c6; --copilot:#a98be0; }
  }
  :root[data-theme="dark"]{ --bg:#15181c; --panel:#1e2227; --border:#2c313a; --text:#e6e9ee; --muted:#8b95a3; }
  :root[data-theme="light"]{ --bg:#f6f7f9; --panel:#fff; --border:#e3e6ea; --text:#1b1f24; --muted:#6b7480; }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.55 system-ui,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden}
  /* 侧栏 */
  .sidebar{width:250px;flex:0 0 250px;border-right:1px solid var(--border);background:var(--panel);
    display:flex;flex-direction:column}
  .brand{padding:12px 14px;font-weight:700;border-bottom:1px solid var(--border);display:flex;
    justify-content:space-between;align-items:center}
  .status{padding:8px 14px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)}
  .status .seat{display:inline-flex;align-items:center;gap:4px;margin-right:8px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .on{background:var(--ok)} .off{background:#c04a4a}
  .topics{flex:1;overflow-y:auto}
  .topic{padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer}
  .topic:hover{background:rgba(127,127,127,.08)}
  .topic.active{background:rgba(59,110,245,.12);border-left:3px solid var(--accent);padding-left:11px}
  .topic .t-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topic .t-meta{font-size:11px;color:var(--muted);margin-top:2px}
  .newbtn{margin:10px 14px;padding:8px;border:1px dashed var(--border);border-radius:8px;
    text-align:center;cursor:pointer;color:var(--muted)}
  .newbtn:hover{color:var(--accent);border-color:var(--accent)}
  /* 主区 */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .msgs{flex:1;overflow-y:auto;padding:16px 18px}
  .msg{margin-bottom:14px;max-width:820px}
  .msg .who{font-weight:700;font-size:12px;margin-bottom:2px}
  .msg .body{white-space:pre-wrap;word-break:break-word;background:var(--panel);
    border:1px solid var(--border);border-radius:8px;padding:8px 10px}
  .who.Erico{color:var(--erico)} .who.claude{color:var(--claude)}
  .who.gpt{color:var(--gpt)} .who.copilot{color:var(--copilot)}
  .msg.Erico .body{background:rgba(10,125,77,.06)}
  .time{color:var(--muted);font-weight:400;font-size:11px;margin-left:6px}
  .busy{padding:6px 18px;color:var(--muted);font-size:12px}
  .busy button{margin-left:10px;padding:3px 9px;border:1px solid var(--border);border-radius:6px;
    background:var(--panel);color:var(--text);cursor:pointer}
  .composer{border-top:1px solid var(--border);padding:10px 14px;background:var(--panel)}
  .composer textarea{width:100%;resize:vertical;min-height:52px;padding:8px;border-radius:8px;
    border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit}
  .composer .row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px}
  .hint{font-size:12px;color:var(--muted)}
  button.send{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 18px;
    cursor:pointer;font:inherit}
  button.send:disabled{opacity:.5;cursor:default}
  /* 记忆栏 */
  .memory{width:280px;flex:0 0 280px;border-left:1px solid var(--border);background:var(--panel);
    display:flex;flex-direction:column}
  .memory h3{margin:0;padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px}
  .mem-list{flex:1;overflow-y:auto;padding:8px 12px}
  .mem{border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:8px;font-size:12px}
  .mem .tag{font-size:10px;padding:1px 6px;border-radius:10px;font-weight:700}
  .mem.draft .tag{background:rgba(184,134,11,.18);color:var(--draft)}
  .mem.approved .tag{background:rgba(10,125,77,.18);color:var(--ok)}
  .mem .src{color:var(--muted);margin-top:4px}
  .mem .acts{margin-top:6px;display:flex;gap:6px}
  .mem .acts button{font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid var(--border);
    background:var(--bg);color:var(--text);cursor:pointer}
  .empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:12px}
  @media (max-width:900px){ .memory{display:none} }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span>ChatHub</span><span class="hint" id="mode-hint"></span></div>
    <div class="status" id="status">通道状态加载中…</div>
    <div class="newbtn" id="new-topic">＋ 新建议题</div>
    <div class="topics" id="topics"></div>
  </aside>

  <main class="main">
    <div class="msgs" id="msgs"><div class="empty">← 左侧选一个议题，或新建一个开始讨论</div></div>
    <div class="busy" id="busy" style="display:none">三席讨论中…（自动刷新）
      <button id="stop">停止（当前席结束后）</button></div>
    <div class="composer">
      <textarea id="input" placeholder="写点什么… 普通消息＝参与模式（各回一次）；以【议题】开头＝议题模式（自主多轮→结论）"></textarea>
      <div class="row">
        <span class="hint" id="composer-hint">普通消息＝参与模式 · 【议题】开头＝议题模式</span>
        <button class="send" id="send" disabled>发送 / 召集</button>
      </div>
    </div>
  </main>

  <aside class="memory">
    <h3>共享记忆（跨议题）</h3>
    <div class="mem-list" id="memory"><div class="empty">议题得出结论后会自动生成记忆草案，确认后跨议题共享。</div></div>
  </aside>

<script>
const $ = s => document.querySelector(s);
let currentTopic = null, pollTimer = null;

const fmtTime = ts => { const d = new Date(ts*1000);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };

async function jget(u){ const r = await fetch(u); return r.json(); }
async function jpost(u,b){ const r = await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify(b||{})}); return {ok:r.ok, status:r.status, data: await r.json().catch(()=>({}))}; }

async function loadStatus(){
  const st = await jget('/api/status');
  $('#status').innerHTML = Object.entries(st).map(([k,v]) =>
    `<span class="seat" title="${escapeHtml(v.reason||'本地前置已就绪')}"><span class="dot ${v.online?'on':'off'}"></span>${k}</span>`).join('');
}

async function loadTopics(){
  const ts = await jget('/api/topics');
  const box = $('#topics');
  box.innerHTML = ts.map(t => `<div class="topic ${t.id===currentTopic?'active':''}" data-id="${t.id}">
      <div class="t-title">${escapeHtml(t.title)}</div>
      <div class="t-meta">${t.status==='concluded'?'已结论':'进行中'} · #${t.id}</div></div>`).join('')
    || '<div class="empty">还没有议题</div>';
  box.querySelectorAll('.topic').forEach(el => el.onclick = () => selectTopic(+el.dataset.id));
}

async function selectTopic(id){
  currentTopic = id;
  await loadTopics();
  await refreshMessages(true);
  $('#send').disabled = false;
  startPolling();
}

function renderMessages(msgs){
  const box = $('#msgs');
  if(!msgs.length){ box.innerHTML = '<div class="empty">这个议题还没有发言，写点什么开始吧</div>'; return; }
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  box.innerHTML = msgs.map(m => `<div class="msg ${m.speaker}">
      <div class="who ${m.speaker}">${m.speaker}<span class="time">${fmtTime(m.created)}</span></div>
      <div class="body">${escapeHtml(m.body)}</div></div>`).join('');
  if(atBottom) box.scrollTop = box.scrollHeight;
}

async function refreshMessages(force){
  if(currentTopic===null) return;
  const d = await jget(`/api/topics/${currentTopic}/messages`);
  renderMessages(d.messages);
  $('#busy').style.display = d.busy ? 'block' : 'none';
  $('#send').disabled = d.busy || currentTopic===null;
  return d.busy;
}

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(refreshMessages, 2000);
}

async function send(){
  const ta = $('#input'); const text = ta.value.trim();
  if(!text || currentTopic===null) return;
  $('#send').disabled = true;
  const r = await jpost(`/api/topics/${currentTopic}/send`, {text});
  if(r.ok){ ta.value=''; await refreshMessages(); }
  else alert(r.data.error || '发送失败');
  if(!r.ok) await refreshMessages();
}

async function stopDiscussion(){
  if(currentTopic===null) return;
  const r = await jpost(`/api/topics/${currentTopic}/stop`);
  if(!r.ok) alert(r.data.error || '停止失败');
  else $('#stop').disabled = true;
}

async function newTopic(){
  const title = prompt('新议题标题：'); if(!title) return;
  const r = await jpost('/api/topics', {title});
  await loadTopics();
  if(r.data.id) selectTopic(r.data.id);
}

async function loadMemory(){
  const items = await jget('/api/memory');
  const box = $('#memory');
  const shown = items.filter(i => i.status!=='rejected');
  if(!shown.length){ box.innerHTML = '<div class="empty">议题得出结论后会自动生成记忆草案，确认后跨议题共享。</div>'; return; }
  box.innerHTML = shown.map(i => `<div class="mem ${i.status}">
      <span class="tag">${i.status==='approved'?'已确认':'草案'}</span>
      <div style="margin-top:5px">${escapeHtml(i.content).slice(0,400)}</div>
      ${i.source?`<div class="src">${escapeHtml(i.source)}</div>`:''}
      ${i.status==='draft'?`<div class="acts">
        <button onclick="mem(${i.id},'approve')">✓ 确认入库</button>
        <button onclick="mem(${i.id},'reject')">✕ 弃置</button></div>`:''}
    </div>`).join('');
}
async function mem(id, act){ await jpost(`/api/memory/${id}/${act}`); loadMemory(); }

function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

$('#send').onclick = send;
$('#stop').onclick = stopDiscussion;
$('#new-topic').onclick = newTopic;
$('#input').addEventListener('keydown', e => { if(e.key==='Enter' && (e.ctrlKey||e.metaKey)) send(); });
$('#input').addEventListener('input', e => {
  const auto = e.target.value.trimStart().startsWith('【议题】') || e.target.value.includes('@自动');
  $('#composer-hint').textContent = auto ? '议题模式：三席自主多轮讨论→出结论' : '普通消息＝参与模式 · 【议题】开头＝议题模式';
});

// 初始化 + 定期刷新记忆
loadStatus(); loadTopics(); loadMemory();
setInterval(loadStatus, 15000);
setInterval(loadMemory, 4000);
</script>
</body>
</html>
