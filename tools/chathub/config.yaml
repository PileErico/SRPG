# ChatHub 调度器配置。改这里即可，不用动 broker.py / engine.py。
#
# 席位分工（2026-07-16 Erico 拍板·独立化重排）：
#   fable    = 项目总负责人（大局/取舍/结论/验收，不写代码）——模型 claude-fable-5
#   gpt      = 讨论主力（独立实现视角；执行后做规格审查）——Codex CLI
#   deepseek = 参谋席（评价与建议；无文件访问，反幻觉硬约束在适配器内置）——DeepSeek HTTP
#   opus     = 纯执行席（**不参与讨论**；fable+gpt 定稿方案后由它落地）——claude-opus-4-8
#              铁律：fable 与 opus 不同桌——两者同为 Claude，同桌买不来第二视角。
#
# 🔒 席位名单的唯一真值＝下面的 speaking_order + adapters + execution.executors 三处，
#    别处（README/前端）只是复述。
#
# 讨论席可勾选：GUI 每条消息可选谁参加（默认勾 default_participants），顺序永远按 speaking_order。

# 目标工作区（被讨论/被执行的项目仓库根）🔒 独立化后必配：
#   chathub 本体不在工作区内；所有「对项目动手」的行为（讨论席引用文件、执行席
#   checkout/commit/diff）都以此为根。GUI 里可切换（校验 git 仓库），选择存 db 延续。
workspace: "D:/1战棋"

# chathub.md 路径（相对＝相对工作区；仅 CLI broker 用，GUI 走 SQLite）
chathub_path: docs/chathub.md

# 触发闸：最后一条发言人 ∈ 此列表才开一轮（防 AI 互相触发的无限回环）
trigger_names: [Erico, Eroco]        # Eroco 是历史笔误，一并认

# 发言顺序（讨论席全集）：gpt 先给实料 → deepseek 评议 → fable 压轴裁决/收束
speaking_order: [gpt, deepseek, fable]

# GUI 讨论默认勾选的席位（deepseek 想要参谋时手动勾）
default_participants: [gpt, fable]

# 每次触发跑几轮（1 = 每人各说一次就停，等 Erico 下一条）
max_rounds: 1

# 每席独立超时（秒）；未列出的用 default_timeout。
# ⚠ 这是 broker 线程超时（讨论档）；各席适配器另有**子进程超时**才是真闸：
#   claude 席=adapters.<席>.timeout（默认 140）、gpt 席=cli_timeout（默认 80）、
#   deepseek 席=http_timeout（默认 55）。约定：子进程超时 < 线程超时。
#   审查/验收等大负载调用不走这里，见 execution.review_timeout。
default_timeout: 90
timeouts:
  fable: 240     # 总负责人做综合/验收，思考更久
  gpt: 90        # npx codex exec 约 10~15s，留足冗余
  deepseek: 60   # DeepSeek HTTP 较快
  opus: 240      # 互查等 _call(opus) 路径用（正常执行走 execution.timeout）；防倒挂＞子进程 220

# watch 模式轮询间隔（秒）
poll_interval: 3

# —— 议题模式（模式②）——
# 参与模式（默认）：Erico 写一条 → 勾选的席位各回一次 → 停（以 Erico 为主）。
# 议题模式：Erico 消息里带 marker → 勾选的席位自主多轮讨论至收敛 → synthesizer 出【结论】。
#   触发写法示例：  Erico：【议题】火药域该不该拆成火枪/爆破两支？
autonomous:
  marker: "【议题】"        # 也永远兼容 "@自动"
  max_rounds: 4             # 自主讨论轮数上限（防不收敛）
  synthesizer: fable        # 总负责人出【结论】
  converge_tag: "[收敛]"    # 席位「我无补充」的行标记
  continue_tag: "[继续]"    # 席位「还要继续」的行标记
  # 拍板权：该席写 verdict_tag 即当轮收口——本轮剩余席位跳过、直接进结论综合，
  # 不必再等全票收敛。只有 arbiter 写才算数（别席写就是普通文本）；严格末行匹配，
  # 正文行内引用不触发。删掉 arbiter 这行＝功能关闭，行为回落到「全票收敛才停」。
  arbiter: fable
  verdict_tag: "[拍板]"

# —— 执行阶段（阶段③）——
# 议题出结论后，Erico 发「【执行】<范围>」= 授权（GUI 勾选执行名单，前端二次确认防误触）。
# 流程：执行者顺序落地（各自分支）→ 审查（≥2 人＝交叉互查；1 人＝spec_reviewer 规格审查，
#       审「落实是否走样」）→ deepseek 参考 → fable 验收。不 push、不碰工作区 main。
execution:
  marker: "【执行】"
  timeout: 1800             # 执行比讨论久，给足
  cross_review: true        # ≥2 名执行者产出 diff 时互查
  spec_reviewer: gpt        # 单执行者时由方案共同定稿人审 diff（互查的单人兜底）
  review_timeout: 300       # 互查/规格审查的线程超时——读「上下文+整份 diff」远比讨论重，
                            # 不能沿用讨论档 90s（须 > 审查席子进程超时，如 gpt 的 cli_timeout）
  reviewer: deepseek        # 参谋席参考意见（无文件访问，只评记录）
  acceptor: fable           # 终验收（看全部 diff + 审查意见，给裁决）
  diff_char_budget: 20000   # 注入审查/验收的每分支 diff 字数上限
  executors:                # 执行席（工位分支开在目标工作区里）
    - seat: opus
      branch: opus
      cmd: ["claude", "-p", "--permission-mode", "bypassPermissions", "--model", "claude-opus-4-8"]

# 各席位适配器接线。class = "模块路径:类名"。
#   ⚠ 某席不可用（缺 CLI/key）会被容错跳过，不阻塞其它席位。
#   各席子进程的 cwd＝上面的 workspace（Config.load 自动注入；显式写 workspace 键可按席覆盖）。
adapters:
  fable:
    class: "adapters.claude:ClaudeAdapter"
    model: "claude-fable-5"
    # GUI 的 model 下拉建议值（自由输入，服务端不校验——写死列表会过期，故只作建议）
    model_suggestions: ["claude-fable-5", "claude-opus-4-8", "claude-sonnet-5"]
    timeout: 220             # 子进程超时（< broker 的 240）
    role_prompt: >-
      你是本项目的总负责人（席位 fable）。职责：把控方向与范围、做取舍与优先级判断、
      发现讨论跑偏或过度工程时把它拉回、在议题收敛时综合【结论】、在执行完成后做验收裁决。
      你不亲自写代码——方案由你和 gpt 讨论定稿成可执行的文档，落地交给执行席 opus。
      你的发言重判断而非罗列：给明确立场、说清理由与代价，别当老好人各打五十大板。
  gpt:
    class: "adapters.gpt:GptAdapter"
    codex_cmd: ["npx", "--yes", "@openai/codex", "exec", "--ephemeral", "--sandbox", "read-only"]
    # 子进程超时=真闸（线程超时只是二道保险）。规格审查要读整份 diff，80s 默认不够；
    # 讨论期若 codex 挂死，线程超时 90s 先行放弃，此值只决定僵尸进程最迟何时自灭。
    cli_timeout: 280
    role_prompt: >-
      你是讨论主力（席位 gpt），与 fable 对话的独立实现视角：可行性、代码结构、边界条件、
      数据迁移、测试怎么写。讨论时给具体方案而非空泛原则——方案定稿后由执行席 opus 落地，
      执行完成后你负责规格审查（审它落实是否走样）。
      方向与取舍听 fable 的裁决，但事实与技术判断上有异议要直说。
  deepseek:
    class: "adapters.deepseek:DeepSeekAdapter"
    endpoint: "https://api.deepseek.com/v1/chat/completions"
    # 🔒 2026-07-16 探测取证后钉死：旧串 deepseek-chat 不仅 07-24 停用，且**静默降级**——
    #    实测其 resp.model 回读为 deepseek-v4-flash，不报错、只给弱模型。v4-pro 已实跑
    #    verified（requested == reported）。effort 枚举见 adapters/deepseek.py。
    model: "deepseek-v4-pro"
    model_suggestions: ["deepseek-v4-pro", "deepseek-v4-flash"]
    api_key_env: "DEEPSEEK_API_KEY"
    http_timeout: 55          # HTTP 请求超时（< broker 的 60；隐形旋钮显性化）
    role_prompt: >-
      你是参谋席（席位 deepseek）。只做评价与建议：审视别人给出的方案与证据、
      指出风险与遗漏。你没有文件访问能力——只能基于记录发言，推测必须标注（详见系统约束）。
  opus:
    # 纯执行席：不在 speaking_order 里，永不参与讨论；此处接线只为执行前的
    # 通道可用性检查、状态栏展示与互查路径。执行时的模型钉在 execution.executors 的 cmd 里。
    class: "adapters.claude:ClaudeAdapter"
    model: "claude-opus-4-8"
    model_suggestions: ["claude-opus-4-8", "claude-fable-5", "claude-sonnet-5"]
    timeout: 220              # 子进程超时（< timeouts.opus 的 240，防倒挂）
    role_prompt: >-
      你是纯执行席（席位 opus）。你不参与讨论——fable 与 gpt 定稿的方案文档就是你的全部输入。
      职责：忠实按文档落地；文档含糊或与代码现状冲突时，选保守解读并在报告中明确写出
      你的解读与取舍，不要自作主张扩大范围。

# —— 端到端自测用（把上面某席的 class 临时改成下面这个即可先跑通全链路）——
#   class: "stub:StubAdapter"
