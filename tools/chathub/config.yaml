# ChatHub 调度器配置。改这里即可，不用动 broker.py。

# chathub.md 路径（相对＝相对仓库根，也可写绝对路径）
chathub_path: docs/chathub.md

# 触发闸：最后一条发言人 ∈ 此列表才开一轮（防 AI 互相触发的无限回环）
trigger_names: [Erico, Eroco]        # Eroco 是历史笔误，一并认

# 发言顺序（claude 先回，copilot 看到 claude 已写再接——单调度器天然保证）
speaking_order: [claude, gpt, copilot]

# 每次触发跑几轮（1 = 每人各说一次就停，等 Erico 下一条）
max_rounds: 1

# 每席独立超时（秒）；未列出的用 default_timeout
default_timeout: 90
timeouts:
  claude: 150      # CLI 冷启动较慢
  gpt: 90          # npx codex exec 约 10~15s，留足冗余
  copilot: 60      # DeepSeek HTTP 较快

# watch 模式轮询间隔（秒）
poll_interval: 3

# —— 议题模式（模式②）——
# 参与模式（默认）：Erico 写一条 → 三席各回一次 → 停（以 Erico 为主）。
# 议题模式：Erico 消息里带 marker → 三席自主多轮讨论至收敛 → synthesizer 出【结论】。
#   触发写法示例：  Erico：【议题】火药域该不该拆成火枪/爆破两支？
autonomous:
  marker: "【议题】"        # 也永远兼容 "@自动"
  max_rounds: 4             # 自主讨论轮数上限（防不收敛）
  synthesizer: claude       # 收敛后由谁写【结论】（默认取 speaking_order 首位）
  converge_tag: "[收敛]"    # 席位「我无补充」的行标记
  continue_tag: "[继续]"    # 席位「还要继续」的行标记

# 各席位适配器接线。class = "模块路径:类名"。
#   ⚠ 未落地的适配器 broker 会容错跳过，不影响其它席位。
#   接线负责人：deepseek/gpt = copilot；claude = 待独立 CLI 装好后我写。
adapters:
  claude:
    class: "adapters.claude:ClaudeAdapter"      # 待写（needs: npm i -g @anthropic-ai/claude-code）
    # role_prompt: 见 prompts（可选，交由适配器读取）
  gpt:
    class: "adapters.gpt:GptAdapter"            # copilot：封装 npx @openai/codex exec
    codex_cmd: ["npx", "--yes", "@openai/codex", "exec", "--ephemeral", "--sandbox", "read-only"]
  copilot:
    class: "adapters.deepseek:DeepSeekAdapter"  # copilot：HTTP api.deepseek.com
    endpoint: "https://api.deepseek.com/v1/chat/completions"
    model: "deepseek-chat"
    api_key_env: "DEEPSEEK_API_KEY"

# —— 端到端自测用（把上面某席的 class 临时改成下面这个即可先跑通全链路）——
#   class: "stub:StubAdapter"
